name: Build IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build App
        run: |
          brew install xcodegen
          printf "name: Rubuddy\noptions:\n  bundleIdPrefix: com.tan\ntargets:\n  Rubuddy:\n    type: application\n    platform: iOS\n    deploymentTarget: '15.0'\n    sources: [ContentView.swift]\n    settings:\n      base:\n        PRODUCT_BUNDLE_IDENTIFIER: com.tan.rubuddy\n        INFOPLIST_KEY_CFBundleDisplayName: 'Rubuddy'\n        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES\n        INFOPLIST_KEY_UILaunchScreen_Generation: YES\n        CODE_SIGN_IDENTITY: ''\n        CODE_SIGNING_REQUIRED: NO\n        CODE_SIGNING_ALLOWED: NO\n" > project.yml
          xcodegen generate
          xcodebuild -project Rubuddy.xcodeproj -scheme Rubuddy -configuration Release -sdk iphoneos -derivedDataPath build clean build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Rubuddy.app Payload/
          zip -r Rubuddy.ipa Payload/
      - uses: actions/upload-artifact@v4
        with:
          name: Rubuddy-IPA
          path: Rubuddy.ipa
